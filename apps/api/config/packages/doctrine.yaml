doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        server_version: '16'
        use_savepoints: true
    orm:
        auto_generate_proxy_classes: '%kernel.debug%'
        enable_native_lazy_objects: true
        auto_mapping: false
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        mappings:
            Storage:
                type: attribute
                dir: '%kernel.project_dir%/src/Storage/Infrastructure/Persistence'
                prefix: 'App\Storage\Infrastructure\Persistence'
                is_bundle: false
            Identity:
                type: attribute
                dir: '%kernel.project_dir%/src/Identity/Infrastructure/Persistence'
                prefix: 'App\Identity\Infrastructure\Persistence'
                is_bundle: false
            Project:
                type: attribute
                dir: '%kernel.project_dir%/src/Project/Infrastructure/Persistence'
                prefix: 'App\Project\Infrastructure\Persistence'
                is_bundle: false
            Marketplace:
                type: attribute
                dir: '%kernel.project_dir%/src/Marketplace/Infrastructure/Persistence'
                prefix: 'App\Marketplace\Infrastructure\Persistence'
                is_bundle: false
when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test'
