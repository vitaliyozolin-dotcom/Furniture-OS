parameters:
    storage_root: '%env(STORAGE_ROOT)%'
services:
    _defaults:
        autowire: true
        autoconfigure: true
    App\:
        resource: '../src/'
        exclude: '../src/{Kernel.php,*/Domain/,*/Infrastructure/Persistence/,Rendering/Application/{Image,RenderRequest,Generation}.php}'
    _instanceof:
        App\Rendering\Application\ImageGenerator:
            tags: ['app.ai_image_generator']
    App\Rendering\Application\RenderJournal: '@App\Rendering\Infrastructure\LocalRenderJournal'
    App\Rendering\Infrastructure\LocalRenderJournal:
        arguments:
            $root: '%env(resolve:AI_RENDER_ROOT)%'
    App\Rendering\Application\RenderCabinet:
        arguments:
            $generators: !tagged_iterator app.ai_image_generator
            $enabled: '%env(bool:AI_ENABLED)%'
            $provider: '%env(AI_PROVIDER)%'
            $maxCostKopecks: '%env(int:AI_MAX_COST_KOPECKS)%'
            $budgetKopecks: '%env(int:AI_BUDGET_KOPECKS)%'
    app.ai_download_client:
        class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
        arguments: ['@http_client']
    App\Rendering\Infrastructure\PolzaNanoBanana:
        arguments:
            $downloads: '@app.ai_download_client'
            $apiKey: '%env(POLZA_API_KEY)%'
            $modelId: '%env(AI_NANO_BANANA_MODEL)%'
            $imageHosts: '%env(AI_POLZA_IMAGE_HOSTS)%'
            $timeoutSeconds: '%env(int:AI_HTTP_TIMEOUT_SECONDS)%'
    App\Storage\Application\FileStorage: '@App\Storage\Infrastructure\LocalFileStorage'
    App\Storage\Infrastructure\LocalFileStorage:
        arguments:
            $root: '%storage_root%'
    App\Storage\Application\FileMetadataRepository: '@App\Storage\Infrastructure\DoctrineFileMetadataRepository'
    App\Platform\Application\Readiness: '@App\Platform\Infrastructure\PostgresReadiness'
    App\Calculation\Domain\PrototypeGeometry: ~
    App\Calculation\Domain\PrototypePricing: ~
    App\Calculation\Presentation\CalculateController:
        tags: ['controller.service_arguments']
    App\Platform\Presentation\HealthController:
        tags: ['controller.service_arguments']
    App\Identity\Domain\Accounts: '@App\Identity\Infrastructure\DoctrineAccounts'
    App\Identity\Application\PasswordHash: '@App\Identity\Infrastructure\SymfonyPasswordHash'
    App\Identity\Application\Contract\CurrentActor: '@App\Identity\Infrastructure\SessionActor'
    App\Identity\Presentation\AuthController:
        tags: ['controller.service_arguments']
        arguments:
            $registrationLimiter: '@limiter.registration'
    App\Cabinet\Application\Contract\CabinetConfigurator: '@App\Cabinet\Application\ConfigureCabinet'
    App\Calculation\Application\Contract\CabinetEstimator: '@App\Calculation\Application\PreliminaryCabinetEstimate'
    App\Project\Domain\Projects: '@App\Project\Infrastructure\DoctrineProjects'
    App\Project\Domain\Revisions: '@App\Project\Infrastructure\DoctrineRevisions'
    App\Project\Application\Contract\ProjectRevisions: '@App\Project\Application\ProjectWorkspace'
    App\Marketplace\Domain\Publications: '@App\Marketplace\Infrastructure\DoctrinePublications'
    App\Cabinet\Presentation\CabinetController:
        tags: ['controller.service_arguments']
    App\Project\Presentation\ProjectController:
        tags: ['controller.service_arguments']
    App\Marketplace\Presentation\PublicationController:
        tags: ['controller.service_arguments']
