server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 64k;
    error_page 413 = @payload_too_large;
    location @payload_too_large {
        default_type application/problem+json;
        add_header X-Correlation-ID $request_id always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        return 413 '{"type":"about:blank","title":"Request rejected","status":413,"detail":"Request body exceeds 64 KiB.","correlationId":"$request_id"}';
    }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    location ~ ^/(api/|health/) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/apps/api/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/apps/api/public;
        fastcgi_pass api:9000;
        fastcgi_read_timeout 30s;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
