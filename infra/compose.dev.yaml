name: furniture-os-dev
services:
  api:
    image: furniture-api-dev
    build:
      target: development
    user: '1000:1000'
    environment:
      COMPOSER_HOME: /tmp/composer
      APP_ENV: dev
      APP_DEBUG: 1
      STORAGE_ROOT: /app/apps/api/var/dev-files
    volumes: !override
      - ..:/app
    command: [php, -S, '0.0.0.0:8000', -t, public, public/index.php]
    ports:
      - '127.0.0.1:8000:8000'
