name: furniture-os
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: furniture
      POSTGRES_USER: furniture
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U furniture -d furniture']
      interval: 3s
      timeout: 3s
      retries: 30
  api:
    image: furniture-os-api
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      target: production
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in infra/.env}
      DATABASE_URL: postgresql://furniture:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/furniture?charset=utf8
      STORAGE_ROOT: /var/lib/furniture/files
    volumes:
      - files:/var/lib/furniture/files
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, bin/console, app:ready]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    image: furniture-os-web
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/health/ready]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  database:
  files:
