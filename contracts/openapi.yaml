    "/api/prototype/v0/calculate": {
      "post": {
        "operationId": "calculatePrototypeCabinet",
        "summary": "Compatibility estimate; not production validated",
        "description": "Stateless preliminary prototype-v0 calculation. Transport safety: finite numbers with absolute value <= 1000000, 1–100 sections, JSON body <= 64 KiB. No projects or snapshots are persisted.",
        "parameters": [
          {
            "in": "header",
            "name": "X-Correlation-ID",
            "schema": {
              "type": "string",
              "pattern": "^[a-zA-Z0-9-]{1,64}$"
            },
            "required": false
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PrototypeCabinetInputV0"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Preliminary compatibility result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PrototypeCalculationResultV0"
                }
              }
            }
          },
          "400": {
            "description": "RFC 9457 problem details",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "413": {
            "description": "RFC 9457 problem details",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "415": {
            "description": "RFC 9457 problem details",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "422": {
            "description": "RFC 9457 problem details",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "500": {
            "description": "RFC 9457 problem details",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        }
      }
    },
