  "components": {
    "schemas": {
      "PrototypeCabinetInputV0": {
        "title": "PrototypeCabinetInputV0",
        "description": "Compatibility input of the existing UI prototype. It is not a production ruleset.",
        "type": "object",
        "additionalProperties": false,
        "required": [
          "width",
          "height",
          "depth",
          "sections",
          "bodyMaterial",
          "facadeMaterial",
          "marginPercent",
          "laborRate"
        ],
        "properties": {
          "width": {
            "type": "number"
          },
          "height": {
            "type": "number"
          },
          "depth": {
            "type": "number"
          },
          "sections": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "type",
                "shelves",
                "drawers"
              ],
              "properties": {
                "type": {
                  "enum": [
                    "shelves",
                    "wardrobe",
                    "drawers"
                  ]
                },
                "shelves": {
                  "type": "number"
                },
                "drawers": {
                  "type": "number"
                }
              }
            }
          },
          "bodyMaterial": {
            "enum": [
              "sonoma",
              "cashmere",
              "graphite"
            ]
          },
          "facadeMaterial": {
            "enum": [
              "chipboard",
              "mdf",
              "mirror"
            ]
          },
          "marginPercent": {
            "type": "number"
          },
          "laborRate": {
            "type": "number"
          }
        }
      },
      "PrototypeCalculationResultV0": {
        "title": "PrototypeCalculationResultV0",
        "description": "Compatibility result of the existing UI prototype. Values are preliminary and not production-authoritative.",
        "type": "object",
        "additionalProperties": false,
        "required": [
          "parts",
          "sheets",
          "hinges",
          "runners",
          "rods",
          "edgeMeters",
          "leadDays",
          "warnings",
          "costs"
        ],
        "properties": {
          "parts": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "name",
                "width",
                "height",
                "quantity",
                "material"
              ],
              "properties": {
                "name": {
                  "type": "string"
                },
                "width": {
                  "type": "number"
                },
                "height": {
                  "type": "number"
                },
                "quantity": {
                  "type": "number"
                },
                "material": {
                  "enum": [
                    "body",
                    "back",
                    "facade"
                  ]
                }
              }
            }
          },
          "sheets": {
            "type": "number"
          },
          "hinges": {
            "type": "number"
          },
          "runners": {
            "type": "number"
          },
          "rods": {
            "type": "number"
          },
          "edgeMeters": {
            "type": "number"
          },
          "leadDays": {
            "type": "number"
          },
          "warnings": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "costs": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "materials",
              "hardware",
              "labor",
              "delivery",
              "margin",
              "total"
            ],
            "properties": {
              "materials": {
                "type": "number"
              },
              "hardware": {
                "type": "number"
              },
              "labor": {
                "type": "number"
              },
              "delivery": {
                "type": "number"
              },
              "margin": {
                "type": "number"
              },
              "total": {
                "type": "number"
              }
            }
          }
        }
      },
      "Problem": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "type",
          "title",
          "status",
          "detail",
          "correlationId"
        ],
        "properties": {
          "type": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer"
          },
          "detail": {
            "type": "string"
          },
          "correlationId": {
            "type": "string"
          }
        }
      },
      "Health": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "status"
        ],
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "ok",
              "ready",
              "unavailable"
            ]
          }
        }
      },
      "Account": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "minLength": 32,
            "maxLength": 32
          },
          "email": {
            "type": "string",
            "format": "email"
          },
          "name": {
            "type": "string",
            "minLength": 2,
            "maxLength": 80
          }
        },
        "required": [
          "id",
          "email",
          "name"
        ]
      },
      "AuthSession": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "user": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Account"
              },
              {
                "type": "null"
              }
            ]
          },
          "csrfToken": {
            "type": "string",
            "minLength": 1,
            "maxLength": 300
          }
        },
        "required": [
          "user",
          "csrfToken"
        ]
      },
      "Registration": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "name": {
            "type": "string",
            "minLength": 2,
            "maxLength": 80
          },
          "email": {
            "type": "string",
            "format": "email",
            "maxLength": 254
          },
          "password": {
            "type": "string",
            "minLength": 10,
            "maxLength": 128
          }
        },
        "required": [
          "name",
          "email",
          "password"
        ]
      },
      "Login": {
        "type": "object",
